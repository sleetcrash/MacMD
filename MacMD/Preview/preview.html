<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" nonce="__MACMD_NONCE__" href="macmd-resource://app/preview-base.css">
<style id="macmd-theme" nonce="__MACMD_NONCE__">__MACMD_CSS__</style>
<script nonce="__MACMD_NONCE__" src="macmd-resource://app/markdown-it.min.js"></script>
<script nonce="__MACMD_NONCE__" src="macmd-resource://app/mermaid.min.js"></script>
</head>
<body>
<div id="content" class="markdown-body"></div>
<script nonce="__MACMD_NONCE__">
"use strict";
// html:false escapes any raw HTML in the untrusted document (the security
// model). breaks:true renders a single newline as a line break, so the preview
// mirrors the line breaks visible in the editor.
var md = window.markdownit({ html: false, breaks: true, linkify: true, typographer: false });

// Autolink like GitHub: explicit schemes, emails, and "www." hosts only. Fuzzy
// bare-domain matching turned file names into links, because ".md" is a
// country domain ("SKILL.md" became http://SKILL.md).
md.linkify.set({ fuzzyLink: false }).add("www.", {
  validate: function (text, pos, self) {
    if (!self.re.www) { self.re.www = new RegExp("^" + self.re.src_host_port_strict + self.re.src_path, "i"); }
    var m = text.slice(pos).match(self.re.www);
    return m ? m[0].length : 0;
  },
  normalize: function (match) { match.url = "http://" + match.url; }
});

// Stamp each top-level block with its 1-based source line (from token.map) so the
// editor's top visible line can drive editor-to-preview scroll sync. The offset
// re-anchors the numbers when a leading front-matter block was split off before
// markdown-it ran (its lines are gone from the source markdown-it sees).
var sourceLineOffset = 0;
md.core.ruler.push("macmd_source_line", function (state) {
  state.tokens.forEach(function (token) {
    if (token.map && token.level === 0) {
      token.attrSet("data-source-line", String(token.map[0] + 1 + sourceLineOffset));
    }
  });
});

// GitHub-style task items, recognized exactly where the editor toggles them:
// a bullet (an ordered "1. [ ]" stays text) outside any blockquote, with the
// box on the marker's own line. The checkbox takes the bullet's place and
// carries its 1-based source line, so a click can flip the matching box in
// the document. Runs before text_join, so an escaped "\[" or an entity
// (text_special) never counts as a box.
md.core.ruler.before("text_join", "macmd_task_list", function (state) {
  var tokens = state.tokens;
  var lists = [];
  var quotes = 0;
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (t.type === "blockquote_open") { quotes++; continue; }
    if (t.type === "blockquote_close") { quotes--; continue; }
    if (t.type === "bullet_list_open" || t.type === "ordered_list_open") { lists.push(t.type); continue; }
    if (t.type === "bullet_list_close" || t.type === "ordered_list_close") { lists.pop(); continue; }
    if (t.type !== "list_item_open" || !t.map || quotes > 0 || lists[lists.length - 1] !== "bullet_list_open") { continue; }
    var para = tokens[i + 1];
    var inline = tokens[i + 2];
    if (para.type !== "paragraph_open" || !para.map || para.map[0] !== t.map[0]) { continue; }
    if (!inline || inline.type !== "inline" || !inline.children.length) { continue; }
    var first = inline.children[0];
    var mark = first.type === "text" && /^\[([ xX])\](?=\s|$)/.exec(first.content);
    if (!mark) { continue; }
    first.content = first.content.slice(mark[0].length).replace(/^\s/, "");
    var box = new state.Token("task_checkbox", "input", 0);
    box.meta = { checked: mark[1] !== " ", line: t.map[0] + 1 + sourceLineOffset };
    inline.children.unshift(box);
    t.attrJoin("class", "task-list-item");
  }
});
md.renderer.rules.task_checkbox = function (tokens, idx) {
  var meta = tokens[idx].meta;
  return '<input type="checkbox" class="task-checkbox" data-task-line="' + meta.line + '"'
    + (meta.checked ? " checked" : "") + ">";
};

// Leading YAML (---) or TOML (+++) front matter, mirroring the editor's rule
// (MarkdownParser.frontMatterSpan): the document's FIRST line is exactly the
// delimiter and a matching closing delimiter line follows. Without this split,
// markdown-it reads "name: x" + "---" as a setext H2, so the metadata rendered
// as a big bold theme-colored heading.
function splitFrontMatter(markdown) {
  var lines = markdown.split("\n");
  var first = (lines[0] || "").replace(/\r$/, "");
  if (first !== "---" && first !== "+++") { return null; }
  for (var i = 1; i < lines.length; i++) {
    if (lines[i].replace(/\r$/, "") === first) {
      return { lines: lines.slice(1, i), lineCount: i + 1, rest: lines.slice(i + 1).join("\n") };
    }
  }
  return null;
}

function escapeHTML(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// The front-matter block rendered as muted metadata; keys take the theme's H1
// color via the injected theme CSS (.front-matter .fm-key).
function frontMatterHTML(lines) {
  var html = '<div class="front-matter" data-source-line="1">';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].replace(/\r$/, "");
    var m = /^([ \t]*)([A-Za-z0-9_-]+):(.*)$/.exec(line);
    if (m) {
      html += '<div class="fm-line">' + escapeHTML(m[1])
        + '<span class="fm-key">' + escapeHTML(m[2]) + '</span>:'
        + escapeHTML(m[3]) + "</div>";
    } else {
      html += '<div class="fm-line">' + (line === "" ? "&nbsp;" : escapeHTML(line)) + "</div>";
    }
  }
  return html + "</div>";
}

// Route relative image srcs through the validated img scheme; Swift does the
// containment check. Absolute paths and any explicit scheme are left as-is
// (remote schemes are blocked by the CSP and the content rule list).
function rewriteImages(container) {
  var imgs = container.querySelectorAll("img");
  for (var i = 0; i < imgs.length; i++) {
    var src = imgs[i].getAttribute("src") || "";
    if (src === "" || src.charAt(0) === "/" || /^[a-z][a-z0-9+.-]*:/i.test(src)) continue;
    imgs[i].setAttribute("src", "macmd-resource://img/" + encodeURIComponent(src));
  }
}

// Mermaid: rendered ONLY here (preview) and in export, never in the editor. Under
// securityLevel:'strict' mermaid DOMPurify-sanitizes the SVG and disables click/JS
// bindings. The CSP forbids 'unsafe-eval' (RED LINE); a diagram type that needs
// eval surfaces as a securitypolicyviolation and is dropped, never accommodated.
window.__mermaidConfig = null;
window.__mermaidRenderCount = 0;
var mermaidCache = {};
var mermaidReady = false;

// Mermaid bakes colors into the SVG it emits, so a diagram cannot inherit the
// theme through CSS the way text does. PreviewCSS publishes the palette as custom
// properties (--mmd-*) and this maps them onto mermaid's own variable names: node
// and actor fills take the flattened code-block surface, every label takes the
// body color, and multi-color series (pie slices, git branches) cycle the theme's
// heading colors. Labels that sit ON a saturated slice or branch take the
// background color for contrast instead of the body color. `darkMode` tells the
// base theme which way to derive whatever is not set here; without it a dark
// page got light-page derivations (white ER rows, black git lines).
function mermaidThemeVariables() {
  var s = getComputedStyle(document.documentElement);
  function v(name, fallback) {
    var value = (s.getPropertyValue(name) || "").trim();
    return value === "" ? fallback : value;
  }
  var dark = document.documentElement.classList.contains("darkAqua");
  var bg = v("--mmd-bg", "#1e1e1e");
  var text = v("--mmd-text", "#ffffff");
  var surface = v("--mmd-surface", "#2c2c2c");
  var line = v("--mmd-line", "#808080");
  var vars = {
    darkMode: dark,
    background: bg,
    primaryColor: surface, primaryTextColor: text, primaryBorderColor: line,
    secondaryColor: surface, secondaryTextColor: text, secondaryBorderColor: line,
    tertiaryColor: bg, tertiaryTextColor: text, tertiaryBorderColor: line,
    mainBkg: surface, nodeBorder: line, nodeTextColor: text,
    lineColor: line, textColor: text, titleColor: text,
    edgeLabelBackground: bg, clusterBkg: bg, clusterBorder: line,
    actorBkg: surface, actorBorder: line, actorTextColor: text, actorLineColor: line,
    signalColor: line, signalTextColor: text,
    labelBoxBkgColor: surface, labelBoxBorderColor: line, labelTextColor: text,
    loopTextColor: text, altBackground: bg,
    noteBkgColor: surface, noteBorderColor: line, noteTextColor: text,
    pieTitleTextColor: text, pieLegendTextColor: text, pieSectionTextColor: bg,
    pieStrokeColor: line, pieOuterStrokeColor: line,
    // Mermaid dims slices to 0.7 by default, which would leave a slice a shade
    // off the heading color it came from and off its own legend swatch.
    pieOpacity: "1",
    // ER attribute rows alternate between the node fill and the page.
    rowOdd: surface, rowEven: bg,
    attributeBackgroundColorOdd: surface, attributeBackgroundColorEven: bg,
    // Sequence autonumber digits sit on a disc filled with the line color.
    sequenceNumberColor: bg,
    scaleLabelColor: text
  };
  for (var i = 1; i <= 12; i++) {
    vars["pie" + i] = v("--mmd-series-" + i, surface);
    if (i <= 4) { vars["cScale" + (i - 1)] = vars["pie" + i]; }
    if (i <= 8) {
      vars["git" + (i - 1)] = vars["pie" + i];
      vars["gitBranchLabel" + (i - 1)] = bg;
    }
  }
  return vars;
}

// A gantt lays itself out to a pixel width mermaid reads from its container at
// render time: 0 in the headless export view, and the first-paint width in the
// preview, which the SVG then keeps. The config pins it to the content column
// instead, and a resize re-renders the width-bound diagrams.
function mermaidContentWidth() {
  return document.getElementById("content").clientWidth || 760;
}
var mermaidLayoutWidth = 0;

function ensureMermaid() {
  if (!mermaidReady && window.mermaid) {
    // suppressErrorRendering: a half-typed diagram fails to parse on every
    // keystroke, and mermaid's default is to APPEND its "Syntax error in text"
    // graphic to the page body, outside #content, where it survives later
    // renders and stacks up at the bottom of the preview. Suppressed, the render
    // still throws and the fence stays a code block (see renderMermaid).
    mermaidLayoutWidth = mermaidContentWidth();
    var config = { startOnLoad: false, securityLevel: "strict", theme: "base",
                   suppressErrorRendering: true,
                   themeVariables: mermaidThemeVariables(),
                   gantt: { useWidth: mermaidLayoutWidth } };
    window.mermaid.initialize(config);
    window.__mermaidConfig = config;
    mermaidReady = true;
  }
}

// Re-init from the current custom properties and content width, then re-render
// each given diagram from the source kept on its wrapper, refreshing its cache
// entry. Ids stay unique per pass so mermaid's SVG defs never collide.
var mermaidRenderPass = 0;

async function rerenderDiagrams(wrappers) {
  mermaidReady = false;
  ensureMermaid();
  mermaidRenderPass++;
  for (var i = 0; i < wrappers.length; i++) {
    var wrapper = wrappers[i];
    if (!wrapper._mmdSource) continue;
    try {
      var out = await window.mermaid.render("mmd-t" + mermaidRenderPass + "-" + i, wrapper._mmdSource);
      wrapper.innerHTML = out.svg;
      mermaidCache[wrapper._mmdCacheKey] = out.svg;
    } catch (e) { /* keep the previous SVG if the re-render fails */ }
  }
}

// A theme or appearance change moves every baked-in diagram color, so the cache
// and the initialized config are both stale.
var mermaidRefreshPending = false;

async function refreshMermaidTheme() {
  mermaidReady = false;
  mermaidCache = {};
  var wrappers = document.querySelectorAll(".mermaid-diagram");
  if (wrappers.length > 0 && window.mermaid) { await rerenderDiagrams(wrappers); }
  window.__mermaidThemePass = (window.__mermaidThemePass || 0) + 1;
}

function scheduleMermaidRefresh() {
  if (mermaidRefreshPending) return;
  mermaidRefreshPending = true;
  // Coalesce: Swift pushes theme CSS and the appearance class back to back.
  setTimeout(function () { mermaidRefreshPending = false; refreshMermaidTheme(); }, 0);
}

var mermaidResizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(mermaidResizeTimer);
  mermaidResizeTimer = setTimeout(function () {
    var bound = document.querySelectorAll(".mermaid-diagram[data-mermaid-width-bound]");
    if (bound.length > 0 && window.mermaid && mermaidContentWidth() !== mermaidLayoutWidth) {
      rerenderDiagrams(bound);
    }
  }, 150);
});

function isWidthBound(source) {
  return /^\s*gantt\b/.test(source.replace(/^\s*%%.*$/gm, ""));
}

// FNV-1a hash of the diagram source, so an unchanged diagram skips re-render.
function fnv1a(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return ("0000000" + h.toString(16)).slice(-8);
}

// Replace each ```mermaid fenced block with its inline SVG. markdown-it emits a
// mermaid fence as <pre><code class="language-mermaid">. Cache hits reuse stored
// SVG and never call mermaid.
async function renderMermaid(container) {
  var blocks = container.querySelectorAll("code.language-mermaid");
  if (blocks.length === 0) return; // no mermaid: skip init and work entirely
  ensureMermaid();
  if (!window.mermaid) return;
  for (var i = 0; i < blocks.length; i++) {
    var code = blocks[i];
    var source = code.textContent;
    var hash = fnv1a(source);
    // Key the cache by source AND block position so two identical diagrams get
    // distinct SVG element ids (mermaid bakes the id into the SVG and its defs).
    var cacheKey = hash + "-" + i;
    var pre = code.parentNode;
    var wrapper = document.createElement("div");
    wrapper.className = "mermaid-diagram";
    wrapper.setAttribute("data-mermaid-hash", hash);
    // Kept for re-theming: once the <pre> is replaced the fence source is gone
    // from the DOM. A JS property, not an attribute, so the source never has to
    // survive HTML escaping.
    wrapper._mmdSource = source;
    wrapper._mmdCacheKey = cacheKey;
    if (isWidthBound(source)) { wrapper.setAttribute("data-mermaid-width-bound", ""); }
    // Keep the source-line anchor the <pre> carried, so scroll sync stays
    // precise around rendered diagrams.
    var srcLine = pre && pre.getAttribute && pre.getAttribute("data-source-line");
    if (srcLine) { wrapper.setAttribute("data-source-line", srcLine); }
    if (mermaidCache[cacheKey] !== undefined) {
      wrapper.innerHTML = mermaidCache[cacheKey];
    } else {
      try {
        var out = await window.mermaid.render("mmd-" + cacheKey, source);
        wrapper.innerHTML = out.svg;
        mermaidCache[cacheKey] = out.svg;
        window.__mermaidRenderCount++;
      } catch (e) {
        continue; // leave the fenced code block if the diagram fails to render
      }
    }
    if (pre && pre.parentNode) { pre.parentNode.replaceChild(wrapper, pre); }
  }
}

window.render = function (markdown) {
  var container = document.getElementById("content");
  var fm = splitFrontMatter(markdown);
  sourceLineOffset = fm ? fm.lineCount : 0;
  var body = md.render(fm ? fm.rest : markdown);
  sourceLineOffset = 0;
  container.innerHTML = (fm ? frontMatterHTML(fm.lines) : "") + body;
  rewriteImages(container);
  rebuildLineIndex();
  // Advance the completion flag whether mermaid resolves or rejects, so the flag
  // never stalls (defense in depth; renderMermaid catches per-block failures).
  // Mermaid swaps <pre> nodes for SVG wrappers, so re-index once it settles.
  function done() {
    rebuildLineIndex();
    window.__renderComplete = (window.__renderComplete || 0) + 1;
  }
  renderMermaid(container).then(done, done);
};

// Headless render for HTML export: markdown-it only, NO image rewrite (the
// macmd-resource scheme only resolves inside the app, so a self-contained export
// keeps the original relative src). Returns the rendered body. M4 makes this
// async and inlines mermaid SVG.
window.renderForExport = async function (markdown) {
  var container = document.getElementById("content");
  var fm = splitFrontMatter(markdown);
  sourceLineOffset = fm ? fm.lineCount : 0;
  var body = md.render(fm ? fm.rest : markdown);
  sourceLineOffset = 0;
  container.innerHTML = (fm ? frontMatterHTML(fm.lines) : "") + body;
  // Drop external image references so the exported file makes NO network request
  // (no tracking beacon) when opened elsewhere. Only data: URIs and document-
  // relative paths survive; anything with a scheme (http:, https:, ...) or a
  // protocol-relative "//host" URL is removed. Relative images are then inlined
  // as data: URIs by HTMLExporter in Swift.
  var imgs = container.querySelectorAll("img");
  for (var i = 0; i < imgs.length; i++) {
    var src = imgs[i].getAttribute("src") || "";
    var isData = /^data:/i.test(src);
    var isExternal = /^[a-z][a-z0-9+.-]*:/i.test(src) || src.slice(0, 2) === "//";
    if (isExternal && !isData) { imgs[i].removeAttribute("src"); }
  }
  // An exported file is static: its checkboxes show state but cannot toggle.
  var boxes = container.querySelectorAll("input.task-checkbox");
  for (var b = 0; b < boxes.length; b++) {
    boxes[b].setAttribute("disabled", "");
    boxes[b].removeAttribute("data-task-line");
  }
  // Inline any mermaid diagrams as SVG before serializing, so the export awaits
  // completion (callAsyncJavaScript awaits the returned promise). A failure falls
  // back to markdown-only rather than an empty export.
  try { await renderMermaid(container); } catch (e) { /* markdown-only fallback */ }
  return container.innerHTML;
};

// Theme CSS is injected after load and on every ThemeController change.
window.setThemeCSS = function (css) {
  var el = document.getElementById("macmd-theme");
  if (el) { el.textContent = css; }
  scheduleMermaidRefresh();
};

// Activate the resolved light/dark block by class on the document element, so the
// choice follows the editor appearance, not the system prefers-color-scheme.
window.setAppearance = function (name) {
  document.documentElement.className = name;
  scheduleMermaidRefresh();
};

// A checkbox click asks Swift to flip that line's box in the document; the
// re-render that follows keeps the preview truthful.
document.getElementById("content").addEventListener("change", function (e) {
  var box = e.target;
  if (!box.classList || !box.classList.contains("task-checkbox")) { return; }
  var bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.macmdTaskToggle;
  var line = parseInt(box.getAttribute("data-task-line"), 10);
  if (bridge && !isNaN(line)) { bridge.postMessage(line); }
});

// ---- Scroll sync ----------------------------------------------------------
// The source-line elements are cached per render (sorted by line, which is
// document order), so following the editor costs a binary search instead of a
// full querySelectorAll walk per scrolled line; noticeably smoother on Intel.
var lineEls = [];
// While a programmatic scroll (driven by the editor) is settling, the shell's
// own scroll events must not echo back to Swift.
var suppressScrollUntil = 0;

function rebuildLineIndex() {
  lineEls = Array.prototype.slice.call(document.querySelectorAll("[data-source-line]"))
    .map(function (el) {
      return { line: parseInt(el.getAttribute("data-source-line"), 10), el: el };
    })
    .filter(function (x) { return !isNaN(x.line); });
}

// Scroll so the nearest block at or after the given 1-based source line sits at
// the top of the viewport (editor-to-preview sync).
window.scrollToLine = function (line) {
  if (!lineEls.length) { return; }
  var lo = 0, hi = lineEls.length - 1, target = lineEls.length - 1;
  while (lo <= hi) {
    var mid = (lo + hi) >> 1;
    if (lineEls[mid].line >= line) { target = mid; hi = mid - 1; } else { lo = mid + 1; }
  }
  suppressScrollUntil = Date.now() + 250;
  window.scrollTo(0, lineEls[target].el.offsetTop);
};

// Preview-to-editor sync: report the top visible block's source line, throttled
// to one animation frame and silenced while the editor is the driver.
var scrollRAF = 0;
window.addEventListener("scroll", function () {
  if (Date.now() < suppressScrollUntil || scrollRAF) { return; }
  scrollRAF = requestAnimationFrame(function () {
    scrollRAF = 0;
    if (Date.now() < suppressScrollUntil) { return; }
    var bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.macmdScroll;
    if (!bridge || !lineEls.length) { return; }
    var y = window.scrollY + 1;
    var lo = 0, hi = lineEls.length - 1, top = lineEls.length - 1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      var el = lineEls[mid].el;
      if (el.offsetTop + el.offsetHeight > y) { top = mid; hi = mid - 1; } else { lo = mid + 1; }
    }
    bridge.postMessage(lineEls[top].line);
  });
}, { passive: true });
</script>
</body>
</html>
